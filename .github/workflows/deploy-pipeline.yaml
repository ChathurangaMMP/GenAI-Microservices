name: Deploy and Verify LocalStack Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Lambda Function
        run: |
          mkdir -p src/package
          pip install -r src/requirements.txt -t src/package/
          cp src/pdf_extraction_lambda.py src/package/
          cd src/package
          zip -r ../../deployment_package.zip .

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: '3.8.0'
          install-awslocal: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tflocal
        run: pip install terraform-local

      - name: Deploy Infrastructure (Terraform)
        working-directory: ./infra
        run: |
          tflocal init
          tflocal apply -auto-approve

      - name: Verify Resource Creation
        run: |
          echo "=== CHECKING S3 BUCKETS ==="
          awslocal s3 ls
          
          echo "=== CHECKING SQS QUEUE ==="
          awslocal sqs list-queues
          
          echo "=== CHECKING LAMBDA FUNCTION ==="
          awslocal lambda list-functions --query 'Functions[*].FunctionName'